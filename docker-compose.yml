version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_biopower
    restart: always
    environment:
      MYSQL_DATABASE: bio_sys_db
      MYSQL_USER: rootbio
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root_master_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: